services:
  - type: web
    name: ai-accounting-agent-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in dashboard
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # set manually in dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: UPLOAD_DIR
        value: /tmp/uploads
